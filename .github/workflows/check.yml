name: check

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      # The simulator service starts cold on fresh runners, which can take a while.
      - name: Start the simulator service
        run: time xcrun simctl list > /dev/null
      - run: bun run check
